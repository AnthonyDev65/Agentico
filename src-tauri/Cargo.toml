[package]
name = "agentico-ide"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentico_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
arboard = { version = "3", default-features = false }
regex = "1.13"
notify = "=8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Gestor de bases de datos PostgreSQL (TLS nativo de Windows; contraseñas en el
# Administrador de credenciales).
tokio-postgres = "=0.7.18"
postgres-native-tls = "=0.5.3"
native-tls = "0.2.18"
keyring = { version = "=3.6.3", features = ["windows-native"] }
# Control remoto (servidor HTTP + SSE para el teléfono). Mismas versiones que ya fija el lockfile.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
getrandom = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
